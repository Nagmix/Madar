name: trippo_driver
description: Trippo Ride-Hailing Platform - Driver App
version: 2.0.0+2
publish_to: 'none'

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Shared package with models, services, and utilities
  trippo_shared:
    path: ../trippo_shared

  # UI
  cupertino_icons: ^1.0.6
  # Open-source map (replaces google_maps_flutter)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  lottie: ^2.6.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Network - NestJS Backend Integration
  dio: ^5.4.0
  socket_io_client: ^2.0.3+1

  # Location & Maps
  geolocator: ^10.1.0

  # Auth - Firebase only for push notifications, not core backend
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^17.2.4

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # URL Launcher
  url_launcher: ^6.2.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.2
  equatable: ^2.0.5
  image_picker: ^1.0.7
  cached_network_image: ^3.3.0

  # Notifications UI
  elegant_notification: ^1.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  custom_lint: ^0.5.6
  riverpod_lint: ^2.3.7
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/imgs/
    - assets/animations/

  fonts:
    - family: bold
      fonts:
        - asset: assets/fonts/Bold.ttf
    - family: light
      fonts:
        - asset: assets/fonts/Light.ttf
    - family: medium
      fonts:
        - asset: assets/fonts/Medium.ttf
    - family: regular
      fonts:
        - asset: assets/fonts/Regular.ttf
    - family: semiBold
      fonts:
        - asset: assets/fonts/SemiBold.ttf
