name: trippo_driver
description: مدار سائق - تطبيق السائق للنقل الذكي
version: 2.0.0+2
publish_to: 'none'

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  trippo_shared:
    path: ../trippo_shared

  # UI
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  lottie: ^2.6.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Network
  dio: ^5.4.0
  socket_io_client: ^2.0.3+1

  # Location & Maps
  geolocator: ^10.1.0

  # Auth
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^17.2.4

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # URL Launcher
  url_launcher: ^6.2.2

  # Utils
  intl: any
  uuid: ^4.2.2
  equatable: ^2.0.5
  image_picker: ^1.0.7
  cached_network_image: ^3.3.0
  elegant_notification: ^1.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  custom_lint: ^0.5.6
  riverpod_lint: ^2.3.7
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.5

flutter:
  uses-material-design: true

  assets:
    - assets/imgs/
    - assets/images/
    - assets/animations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#00BFA5"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#00BFA5"
  image: assets/images/splash_logo.png
  android: true
  android_12:
    image: assets/images/splash_logo.png
    color: "#00BFA5"
